<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Interactiva: Autenticación JWT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Librerías para resaltado de sintaxis (Highlight.js) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Chosen Palette: Warm Neutrals with Indigo Accents -->
    <!-- Application Structure Plan: Dashboard interactivo de aprendizaje orientado a tareas. Se divide en una barra lateral de navegación de pasos y un área principal de contenido dinámico. Esta estructura permite al usuario explorar el flujo de autenticación de forma secuencial o no lineal, interactuando con las explicaciones y viendo el código correspondiente al instante, lo cual es ideal para un tutorial técnico. -->
    <!-- Visualization & Content Choices: Report Info -> Flujo de Aprendizaje. Goal -> Informar progreso y organizar pasos. Viz/Presentation Method -> Gráfico de Anillo (Chart.js) para progreso, Diagrama de bloques (HTML/CSS) para arquitectura, y renderizado dinámico de texto/código para el contenido. Interaction -> Clic en pasos actualiza el contenido y el gráfico. Justification -> Facilita la retención de conceptos técnicos combinando lectura con visualización estructural. Library/Method -> Chart.js, HTML/CSS flexbox (Confirmando NO SVG/Mermaid). -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <style>
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 250px;
            margin-left: auto;
            margin-right: auto;
            height: 250px;
            max-height: 250px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f5f5f4; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d6d3d1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a8a29e; 
        }
        .code-block {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            background: transparent !important; /* Sobreescribe el fondo de highlight.js para usar el de tailwind */
            padding: 0 !important;
        }
        .nav-item.active {
            background-color: #e0e7ff;
            border-left-color: #4f46e5;
            color: #312e81;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <aside class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-stone-200 h-full flex flex-col shadow-sm z-10">
        <div class="p-6 border-b border-stone-200 bg-stone-50">
            <h1 class="text-2xl font-bold text-indigo-900 leading-tight">Implementación JWT</h1>
            <p class="text-sm text-stone-500 mt-2">Guía interactiva paso a paso</p>
        </div>

        <div class="p-6 border-b border-stone-200 bg-white flex flex-col items-center justify-center">
            <h2 class="text-sm font-semibold text-stone-600 mb-4 uppercase tracking-wider">Tu Progreso</h2>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-2" id="nav-menu">
        </nav>
    </aside>

    <main class="flex-1 h-full overflow-y-auto custom-scrollbar bg-stone-50 relative">
        <div class="max-w-4xl mx-auto p-8 pb-20">
            
            <header class="mb-8">
                <span id="step-badge" class="px-3 py-1 text-xs font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 rounded-full mb-3 inline-block">Módulo</span>
                <h2 id="content-title" class="text-3xl md:text-4xl font-extrabold text-stone-900 mt-2">Cargando...</h2>
                <p id="content-intro" class="text-lg text-stone-600 mt-4 leading-relaxed">Preparando la información...</p>
            </header>

            <div id="visual-diagram-container" class="mb-10 hidden bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                <h3 class="text-sm font-bold text-stone-400 uppercase tracking-widest mb-6 text-center">Flujo de Autenticación</h3>
                
                <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0 md:space-x-4">
                    <div class="bg-stone-100 border-2 border-stone-300 rounded-lg p-4 w-40 text-center font-semibold text-stone-700 shadow-sm">
                        Frontend (Cliente)
                    </div>
                    
                    <div class="flex flex-col items-center space-y-2 flex-1">
                        <div class="text-xs font-mono bg-indigo-50 text-indigo-700 px-2 py-1 rounded">1. POST /login (Credenciales) ➔</div>
                        <div class="text-xs font-mono bg-emerald-50 text-emerald-700 px-2 py-1 rounded">2. 🡨 Recibe Token JWT</div>
                        <div class="text-xs font-mono bg-amber-50 text-amber-700 px-2 py-1 rounded">3. GET /perfil (Header: Bearer) ➔</div>
                    </div>

                    <div class="bg-indigo-900 border-2 border-indigo-950 rounded-lg p-4 w-40 text-center font-semibold text-white shadow-sm">
                        Backend (API Express)
                    </div>
                </div>
            </div>

            <div class="bg-stone-900 rounded-xl overflow-hidden shadow-lg border border-stone-800">
                <div class="bg-stone-800 px-4 py-3 flex items-center justify-between border-b border-stone-700">
                    <div class="flex space-x-2">
                        <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                    <span id="code-filename" class="text-stone-400 text-xs font-mono">archivo.js</span>
                </div>
                <div class="p-4 overflow-x-auto custom-scrollbar bg-[#282c34]">
                    <pre><code id="code-content" class="code-block text-sm text-stone-300"></code></pre>
                </div>
            </div>

            <div class="mt-8 flex justify-between">
                <button id="btn-prev" class="px-6 py-2 bg-white border border-stone-300 text-stone-700 font-semibold rounded-lg hover:bg-stone-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Anterior</button>
                <button id="btn-next" class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Siguiente Paso</button>
            </div>
        </div>
    </main>

    <script>
        const tutorialData = [
            {
                id: 'intro',
                badge: 'Visión General',
                title: 'El Flujo de Autenticación JWT',
                intro: 'En esta sección interactiva aprenderás a conectar tu frontend con una API protegida por JWT. El usuario envía sus credenciales, el servidor responde con un token encriptado, y nosotros guardamos ese token en el navegador para usarlo como nuestra "llave de acceso".',
                filename: 'flujo-teorico.txt',
                language: 'plaintext',
                code: 'Flujo de trabajo:\n\n1. Usuario ingresa email y password.\n2. Frontend realiza petición POST a la API.\n3. API valida y devuelve un JSON Web Token (JWT).\n4. Frontend almacena el JWT en localStorage.\n5. Frontend adjunta el JWT en el Header "Authorization" para futuras peticiones.\n6. Logout = Eliminar el JWT del localStorage.',
                showDiagram: true
            },
            {
                id: 'arch',
                badge: 'Paso 1',
                title: 'Arquitectura del Proyecto',
                intro: 'Para mantener el código organizado y escalable, separamos las responsabilidades en vistas (HTML), estilos (CSS) y lógica (JS). Esta estructura permite un mantenimiento sencillo utilizando únicamente tecnologías nativas del navegador (Vanilla JS).',
                filename: 'Estructura de Carpetas',
                language: 'plaintext',
                code: '/mi-proyecto-auth\n│\n├── index.html          # Página pública (Formulario de Login)\n├── dashboard.html      # Página privada (Solo accesible con token)\n│\n├── /css\n│   └── style.css       # Estilos globales y minimalistas\n│\n└── /js\n    ├── auth.js         # Lógica de inicio de sesión (Fetch al backend)\n    └── dashboard.js    # Protección de ruta, persistencia y logout',
                showDiagram: false
            },
            {
                id: 'ui',
                badge: 'Paso 2',
                title: 'Interfaz de Usuario',
                intro: 'Creamos interfaces limpias y modernas. Utilizamos variables CSS para mantener consistencia en la paleta de colores. El formulario de login captura los eventos submit para procesarlos asíncronamente con JavaScript.',
                filename: 'index.html (Fragmento)',
                language: 'html',
                code: '<!-- Contenedor principal centrado -->\n<main class="container">\n    <div class="card">\n        <h1>Bienvenido</h1>\n        \n        <!-- Capturamos el evento \'submit\' con JavaScript usando este ID -->\n        <form id="loginForm">\n            <div class="input-group">\n                <label for="email">Correo Electrónico</label>\n                <input type="email" id="email" required>\n            </div>\n            <div class="input-group">\n                <label for="password">Contraseña</label>\n                <input type="password" id="password" required>\n            </div>\n            \n            <button type="submit" id="submitBtn">Ingresar</button>\n            \n            <!-- Aquí inyectaremos los mensajes de error dinámicamente -->\n            <div id="errorMessage" class="error-message"></div>\n        </form>\n    </div>\n</main>',
                showDiagram: false
            },
            {
                id: 'auth',
                badge: 'Paso 3',
                title: 'Lógica de Autenticación',
                intro: 'Interceptamos el formulario con Vanilla JS, prevenimos la recarga y enviamos un POST usando fetch API. Usamos async/await para código más limpio. Si es exitoso, almacenamos el token en localStorage.',
                filename: 'js/auth.js',
                language: 'javascript',
                code: '// URL de la API de autenticación (Ejemplo)\nconst API_LOGIN_URL = \'http://localhost:3000/api/login\';\n\nconst handleLogin = async (event) => {\n    // 1. Prevenir el comportamiento por defecto (recargar la página)\n    event.preventDefault();\n    \n    // 2. Extraer los valores de los inputs\n    const email = document.getElementById(\'email\').value;\n    const password = document.getElementById(\'password\').value;\n\n    try {\n        // 3. Realizar la petición POST al backend enviando credenciales\n        const response = await fetch(API_LOGIN_URL, {\n            method: \'POST\',\n            headers: { \'Content-Type\': \'application/json\' },\n            body: JSON.stringify({ email, password })\n        });\n\n        // 4. Verificar respuesta exitosa\n        if (!response.ok) throw new Error(\'Credenciales incorrectas\');\n        \n        const data = await response.json();\n\n        // 5. Si la API devuelve un token, lo guardamos\n        if (data.token) {\n            // localStorage permite guardar pares clave-valor que persisten\n            localStorage.setItem(\'jwt_token\', data.token);\n            \n            // 6. Redirigir al usuario a la zona privada\n            window.location.href = \'dashboard.html\';\n        }\n    } catch (error) {\n        // 7. Manejo de errores visuales\n        document.getElementById(\'errorMessage\').textContent = error.message;\n    }\n};\n\n// Escuchamos el evento \'submit\' del formulario\ndocument.getElementById(\'loginForm\').addEventListener(\'submit\', handleLogin);',
                showDiagram: false
            },
            {
                id: 'protect',
                badge: 'Pasos 4 y 5',
                title: 'Protección de Rutas',
                intro: 'Si no hay token, no hay acceso. Al cargar el dashboard, verificamos la existencia del token. Si existe, lo adjuntamos en el header Authorization usando la sintaxis "Bearer <token>" para consumir datos privados.',
                filename: 'js/dashboard.js (Parte 1)',
                language: 'javascript',
                code: '// URL para obtener datos protegidos del usuario\nconst API_USER_DATA_URL = \'http://localhost:3000/api/user/profile\';\n\nconst checkSession = async () => {\n    // 1. Intentar recuperar el token del localStorage\n    const token = localStorage.getItem(\'jwt_token\');\n    \n    // 2. Protección: Si no hay token, redirigir al Login inmediatamente\n    if (!token) {\n        window.location.href = \'index.html\';\n        return;\n    }\n\n    try {\n        // 3. Petición para obtener datos privados\n        const response = await fetch(API_USER_DATA_URL, {\n            headers: {\n                // MAGIA DE SEGURIDAD: Adjuntar el Gafete (Token)\n                \'Authorization\': `Bearer ${token}`,\n                \'Content-Type\': \'application/json\'\n            }\n        });\n\n        // 4. Si el token expiró o es alterado, el backend lo rechaza\n        if (!response.ok) throw new Error(\'Token inválido o expirado\');\n        \n        const userData = await response.json();\n        // Aquí seguiría la lógica para inyectar userData en la UI...\n\n    } catch (error) {\n        // Si ocurre un error de validación, destruimos rastros y expulsamos\n        localStorage.removeItem(\'jwt_token\');\n        window.location.href = \'index.html\';\n    }\n};\n\n// Ejecutamos la validación en cuanto carga este script\ncheckSession();',
                showDiagram: false
            },
            {
                id: 'logout',
                badge: 'Paso 6',
                title: 'Logout y Limpieza',
                intro: 'Cerrar sesión en JWT (lado del cliente) es extremadamente simple: basta con eliminar el token del almacenamiento del navegador y redirigir al usuario.',
                filename: 'js/dashboard.js (Parte 2)',
                language: 'javascript',
                code: '/**\n * Función para manejar el cierre de sesión.\n */\nconst handleLogout = () => {\n    // 1. Destruir el gafete de acceso eliminándolo del localStorage\n    localStorage.removeItem(\'jwt_token\');\n    \n    // 2. Redirigir al usuario de vuelta a la pantalla de inicio de sesión\n    window.location.href = \'index.html\';\n};\n\n// 3. Asignar el evento click al botón de cierre de sesión en la UI\nconst logoutBtn = document.getElementById(\'logoutBtn\');\nif (logoutBtn) {\n    logoutBtn.addEventListener(\'click\', handleLogout);\n}',
                showDiagram: false
            }
        ];

        let currentIndex = 0;
        let visitedSteps = new Set([0]);
        let progressChartInstance = null;

        const navMenu = document.getElementById('nav-menu');
        const contentTitle = document.getElementById('content-title');
        const contentIntro = document.getElementById('content-intro');
        const stepBadge = document.getElementById('step-badge');
        const codeFilename = document.getElementById('code-filename');
        const codeContent = document.getElementById('code-content');
        const visualDiagramContainer = document.getElementById('visual-diagram-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initApp() {
            renderNav();
            initChart();
            loadStep(0);
            setupButtons();
        }

        function renderNav() {
            navMenu.innerHTML = '';
            tutorialData.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-item w-full text-left px-4 py-3 rounded-lg border-l-4 border-transparent text-stone-600 hover:bg-stone-100 transition-colors flex flex-col focus:outline-none';
                btn.innerHTML = `
                    <span class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-1">${step.badge}</span>
                    <span class="font-medium">${step.title}</span>
                `;
                btn.onclick = () => loadStep(index);
                navMenu.appendChild(btn);
            });
        }

        function loadStep(index) {
            currentIndex = index;
            visitedSteps.add(index);
            const step = tutorialData[index];

            const navItems = navMenu.querySelectorAll('.nav-item');
            navItems.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            stepBadge.textContent = step.badge;
            contentTitle.textContent = step.title;
            contentIntro.textContent = step.intro;
            codeFilename.textContent = step.filename;
            
            // Asignar contenido, clase de lenguaje y aplicar resaltado de sintaxis
            codeContent.textContent = step.code;
            codeContent.className = `code-block text-sm language-${step.language}`;
            // Evitar warnings de Highlight.js eliminando el atributo data-highlighted si existe
            delete codeContent.dataset.highlighted; 
            hljs.highlightElement(codeContent);

            if (step.showDiagram) {
                visualDiagramContainer.classList.remove('hidden');
            } else {
                visualDiagramContainer.classList.add('hidden');
            }

            btnPrev.disabled = index === 0;
            btnNext.disabled = index === tutorialData.length - 1;

            updateChart();
        }

        function setupButtons() {
            btnPrev.onclick = () => {
                if (currentIndex > 0) loadStep(currentIndex - 1);
            };
            btnNext.onclick = () => {
                if (currentIndex < tutorialData.length - 1) loadStep(currentIndex + 1);
            };
        }

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            progressChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Completado', 'Pendiente'],
                    datasets: [{
                        data: [1, tutorialData.length - 1],
                        backgroundColor: ['#4f46e5', '#e5e7eb'],
                        borderWidth: 0,
                        cutout: '75%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    animation: { animateScale: true }
                },
                plugins: [{
                    id: 'textCenter',
                    beforeDraw: function(chart) {
                        var width = chart.width, height = chart.height, ctx = chart.ctx;
                        ctx.restore();
                        var fontSize = (height / 80).toFixed(2);
                        ctx.font = "bold " + fontSize + "em sans-serif";
                        ctx.textBaseline = "middle";
                        ctx.fillStyle = "#312e81";
                        var text = Math.round((visitedSteps.size / tutorialData.length) * 100) + "%",
                            textX = Math.round((width - ctx.measureText(text).width) / 2),
                            textY = height / 2;
                        ctx.fillText(text, textX, textY);
                        ctx.save();
                    }
                }]
            });
        }

        function updateChart() {
            if (!progressChartInstance) return;
            const completed = visitedSteps.size;
            const pending = tutorialData.length - completed;
            progressChartInstance.data.datasets[0].data = [completed, pending];
            progressChartInstance.update();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
