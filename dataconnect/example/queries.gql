query ListAllProjects @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  projects {
    id
    name
    description
    dueDate
    owner {
      displayName
    }
  }
}

query GetMyTasks @auth(level: USER) {
  tasks(where: {assignedToId: {eq_expr: "auth.uid"}}) {
    id
    title
    isCompleted
    dueDate
    priority
    project {
      name
    }
  }
}

mutation CreateNewProject($name: String!, $description: String, $dueDate: Date) @auth(level: USER) {
  project_insert(data: {
    name: $name,
    description: $description,
    dueDate: $dueDate,
    ownerId_expr: "auth.uid",
    createdAt_expr: "request.time"
  }) {
    id
  }
}

mutation CompleteMyTask($taskId: UUID!) @auth(level: USER) {
  task_updateMany(
    where: {
      id: {eq: $taskId},
      assignedToId: {eq_expr: "auth.uid"}
    },
    data: {
      isCompleted: true
    }
  )
}